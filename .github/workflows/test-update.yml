name: Bot test update
on:
  workflow_dispatch:
permissions: {}
jobs:
  propose:
    if: github.repository == 'hrmcngs/github-ai-fix-bot' && github.event_name == 'workflow_dispatch'
    concurrency:
      group: bot-test-update-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Create a comment-only test update PR without AI
        run: node scripts/create-test-update.mjs
        env:
          GH_TOKEN: ${{ github.token }}
