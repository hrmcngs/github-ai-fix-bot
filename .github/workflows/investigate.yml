name: AI investigation
on:
  workflow_dispatch:
    inputs:
      target:
        description: 調査する対象
        type: choice
        options: [issue, dependabot]
        required: true
      number:
        description: IssueまたはDependabotアラートの番号（APIキーを入力しない）
        type: string
        required: true
  issues:
    types: [labeled]
  schedule:
    - cron: '23 * * * *'
permissions: {}
# Serialise publication and deduplication; never cancel a run while posting.
concurrency:
  group: ai-investigation-${{ github.repository }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      vulnerability-alerts: read
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
      provider: ${{ steps.prepare.outputs.provider }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - id: prepare
        run: node .github/ai-bot/src/main.js prepare
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: investigation-bundle
          path: .work/bundle.json
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error

  analyze:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: investigation-bundle
          path: .work
      - name: Build isolated Claude runner without credentials
        if: needs.prepare.outputs.provider == 'claude'
        run: docker build --build-arg PROVIDER=claude -f .github/ai-bot/Dockerfile -t ai-bot-claude:local .github/ai-bot
      - name: Build isolated Codex runner without credentials
        if: needs.prepare.outputs.provider == 'codex'
        run: docker build --build-arg PROVIDER=codex -f .github/ai-bot/Dockerfile -t ai-bot-codex:local .github/ai-bot
      - name: Build credential broker without credentials
        if: needs.prepare.outputs.provider != 'tokyo'
        run: docker build --build-arg PROVIDER=broker -f .github/ai-bot/Dockerfile -t ai-bot-broker:local .github/ai-bot
      - name: Analyze with the selected AI
        run: node .github/ai-bot/src/main.js analyze
        env:
          AI_API_KEY: ${{ needs.prepare.outputs.provider == 'tokyo' && secrets.TOKYO_AI_API_KEY || needs.prepare.outputs.provider == 'claude' && secrets.ANTHROPIC_API_KEY || needs.prepare.outputs.provider == 'codex' && secrets.OPENAI_API_KEY || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: investigation-result
          path: .work/result.json
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: [prepare, analyze]
    if: needs.prepare.outputs.ready == 'true' && needs.analyze.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: investigation-bundle
          path: .work
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: investigation-result
          path: .work
      - name: Publish investigation or safe error
        run: node .github/ai-bot/src/main.js publish
        env:
          GH_TOKEN: ${{ github.token }}
